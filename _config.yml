# Site settings. Content lives in _data/*.yml; you rarely need to edit this file.
title: Dayoung Gong
description: Dayoung Gong, computer vision researcher working on long-form video understanding.
url: https://gongda0e.github.io
baseurl: ""
lang: en

# How many news items appear on the home page before "Older news".
news_on_home: 6

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
